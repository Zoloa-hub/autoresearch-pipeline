name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.12", "3.13"]
        exclude:
          # macOS 上只跑一个版本：既省 CI 分钟，又保留"非 Linux、非 Windows"这一档覆盖
          - os: macos-latest
            python-version: "3.10"
          - os: macos-latest
            python-version: "3.13"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # 关键设计：**不安装任何第三方依赖**。
      # 七个测试套件必须能在裸 Python 上全绿——这是"零强制依赖"这个承诺的
      # 可执行证据，也是新用户 `pip install` 之前就能 `python -m autoresearch.cli demo`
      # 跑通全流程的前提。装了依赖反而会掩盖降级路径的回归。
      - name: Show interpreter
        run: python -VV

      # 冒烟步骤**不阻断**后续套件。
      #
      # 第一次真实运行时，Windows 三个版本都死在这一步，于是后面 7 个套件
      # 全部 skipped —— 我因此丢了 5 个平台 × 6 个套件的信号，恰好是最需要
      # 日志的时候没有日志。冒烟失败是"表面功能有问题"，不该有阻断权。
      #
      # 注意**不要**在这里用 `>> "$GITHUB_ENV"` 之类的 bash 语法：
      # Windows runner 的默认 shell 是 pwsh，那样写等于自己制造一个新的
      # 平台相关失败（我第一版就这么写的）。
      - name: Smoke — CLI surface
        continue-on-error: true
        run: python -m autoresearch.cli stages --json

      - name: Suite 1/7 — config + LLM layer
        if: always()
        run: python -m autoresearch.tests.test_config_llm

      - name: Suite 2/7 — retrieval + PDF parsing
        if: always()
        run: python -m autoresearch.tests.test_retrieve

      - name: Suite 3/7 — sandbox + LaTeX
        if: always()
        run: python -m autoresearch.tests.test_sandbox_latex

      - name: Suite 4/7 — figures + metrics
        if: always()
        run: python -m autoresearch.tests.test_figures_metrics

      - name: Suite 5/7 — prompt library + templates
        if: always()
        run: python -m autoresearch.tests.test_prompts

      - name: Suite 6/7 — experiment adapters
        if: always()
        run: python -m autoresearch.tests.test_adapters

      - name: Suite 7/7 — end-to-end pipeline (mock LLM, offline)
        if: always()
        run: python -m autoresearch.tests.test_pipeline

      # 裸环境跑完之后，确认降级路径确实**跳过**了而不是**悄悄通过**。
      # 没有这一步，一个「把绘图断言删掉」的提交也能让上面的 job 全绿。
      - name: Assert optional-dependency skips are reported
        if: always()
        shell: bash
        # 这一步必须**自己保证**没有第三方依赖，而不是依赖 job 的隐含状态。
        # 早期版本在混合条件下运行，于是 Linux 上恰好成立、macOS/Windows 上
        # 不成立——"跳过上报"本来就是裸环境专有的性质。
        # 用 sitecustomize 把 site-packages 从 sys.path 里摘掉，
        # 并且用 PYTHONPATH 注入，使**子进程**（沙箱里的实验脚本）同样被隔离。
        run: |
          GUARD="$PWD/.autoresearch/_bare_guard"
          mkdir -p "$GUARD"
          cat > "$GUARD/sitecustomize.py" <<'PY'
          import sys
          sys.path = [p for p in sys.path
                      if "site-packages" not in p and "dist-packages" not in p]
          PY
          OUT=$(PYTHONPATH="$GUARD:$PWD" python -c "import runpy,sys; sys.argv=['autoresearch.tests.test_figures_metrics']; runpy.run_module('autoresearch.tests.test_figures_metrics', run_name='__main__')" 2>&1)
          echo "$OUT" | tail -20
          echo "$OUT" | grep -q "SKIPPED" || {
            echo "::error::裸环境下应当明确报告跳过，而不是静默通过"
            exit 1
          }
          echo "$OUT" | grep -qE "PASSED [0-9]+ checks" || {
            echo "::error::测试仍应实际执行并给出计数"
            exit 1
          }
          echo "skip reporting ok"

  # 第二个 job：装上可选依赖再跑一遍受影响的套件。
  #
  # 为什么必须两个 job 都保留：
  #   * 只跑裸环境 → 绘图与 PDF 解析代码**完全没有 CI 信号**（跳过不等于测过）；
  #   * 只跑装好依赖的环境 → "零强制依赖" 这条不变量失去可执行证据。
  # 两个一起跑，才既守住不变量又真的覆盖到那些代码路径。
  extras:
    name: extras (optional deps installed) — py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install optional extras
        run: python -m pip install --upgrade ".[figures,pdf,http]"

      - name: figures + metrics — full (incl. real plotting)
        if: always()
        run: python -m autoresearch.tests.test_figures_metrics

      - name: retrieval + PDF parsing — full (incl. real PDF via PyMuPDF)
        if: always()
        run: python -m autoresearch.tests.test_retrieve

      - name: end-to-end pipeline with figures enabled
        if: always()
        run: python -m autoresearch.tests.test_pipeline

      - name: Assert nothing was skipped
        if: always()
        # 显式声明 bash：这一步用了 heredoc，是 bash 语法。
        # ubuntu runner 的默认 shell 本来就是 bash，但依赖默认值不如写明——
        # 默认值一旦变化，失败会以「语法错误」出现，很难归因到真正原因。
        shell: bash
        run: |
          python - <<'PY'
          import subprocess, sys
          for mod in ("test_figures_metrics", "test_retrieve"):
              r = subprocess.run(
                  [sys.executable, "-m", f"autoresearch.tests.{mod}"],
                  capture_output=True, text=True, encoding="utf-8", errors="replace",
              )
              assert r.returncode == 0, f"{mod} failed:\n{r.stdout[-2000:]}"
              assert "SKIPPED" not in r.stdout, (
                  f"{mod} 报告了跳过，但这个 job 装了 [figures,pdf]——"
                  f"说明依赖没装上或导入名写错了:\n{r.stdout[-1500:]}"
              )
          print("no skips with extras installed")
          PY

  packaging:
    name: packaging (sdist + wheel + cli entry point)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # pyproject.toml 的包清单/包数据一旦写错，用户 `pip install` 后会缺提示词或
      # 模板，直到运行时才炸。这里真的构建并安装，然后检查关键资源是否存在。
      - name: Build
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Install the wheel
        run: python -m pip install dist/*.whl

      - name: Verify packaged resources and entry point
        run: |
          python -c "import autoresearch, pathlib; p = pathlib.Path(autoresearch.__file__).parent; assert (p/'prompts'/'s1_queries.md').is_file(), 'prompts missing'; assert (p/'templates'/'paper'/'main.tex').is_file(), 'paper template missing'; assert (p/'templates'/'experiment'/'train.py').is_file(), 'experiment template missing'; print('resources ok')"
          autoresearch stages --json > /dev/null && echo "entry point ok"
          autoresearch doctor --json || true

  lint:
    name: static checks (compile + import hygiene)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 不引入 ruff/mypy 这类会随版本漂移的门禁；只查"装上就能跑"的硬事实：
      # 语法正确、导入完整、没有把密钥写进仓库。
      - name: Byte-compile every module
        run: python -m compileall -q autoresearch

      # 导入每个模块，验证没有语法/循环导入/名字错误。
      #
      # 注意：**不能**要求"裸环境下每个模块都能导入"——那和"零强制依赖"矛盾。
      # `tools/figures` 在模块级 import matplotlib，`templates/experiment/train`
      # 在模块级 import numpy，它们**按设计**就需要可选依赖。早期这个步骤把它们
      # 的 ImportError 当成失败，于是 lint 在裸环境必然变红。
      #
      # 现在的判定分两类：
      #   * 核心模块：必须导入成功；
      #   * 声明了可选依赖的模块：**要么导入成功，要么报出缺失的那个依赖名**。
      #     后者仍然有价值——它证明失败原因是"缺可选依赖"而不是代码写坏了。
      - name: Import every module
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import importlib, pathlib, sys

          #: 模块 → 它要求的可选依赖（裸环境下允许 ImportError，但必须是这一个）
          OPTIONAL = {
              "autoresearch.tools.figures": "matplotlib",
              "autoresearch.tools.metrics": None,       # 已改为 pandas 可选、核心可用
              "autoresearch.templates.experiment.train": "numpy",
              "autoresearch.adapters.lorenz_governance": None,  # torch 只在方法内 import
          }

          root = pathlib.Path("autoresearch")
          core_failed: list[str] = []
          optional_ok: list[str] = []
          optional_bad: list[str] = []
          core_count = 0

          for path in sorted(root.rglob("*.py")):
              if "__pycache__" in path.parts:
                  continue
              if path.name.startswith("test_") or path.parent.name == "tests":
                  continue
              mod = ".".join(path.with_suffix("").parts)
              expect_missing = OPTIONAL.get(mod, "__core__")
              try:
                  importlib.import_module(mod)
              except ImportError as exc:
                  text = str(exc)
                  if expect_missing == "__core__":
                      core_failed.append(f"{mod}: ImportError: {text}")
                  elif expect_missing and expect_missing in text:
                      optional_ok.append(f"{mod} (需要 {expect_missing}，如实报告)")
                  else:
                      optional_bad.append(f"{mod}: 期望缺 {expect_missing!r}，实际: {text}")
              except Exception as exc:
                  core_failed.append(f"{mod}: {type(exc).__name__}: {exc}")
              else:
                  if expect_missing == "__core__":
                      core_count += 1

          for line in optional_ok:
              print(f"  optional: {line}")
          problems = core_failed + optional_bad
          if problems:
              print("\n".join(problems))
              sys.exit(1)
          print(f"{core_count} core modules import cleanly; "
                f"{len(optional_ok)} optional-dependency modules degrade correctly")
          PY

      - name: No committed secrets
        shell: bash
        run: |
          # .env 必须被 gitignore 挡住。
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env is tracked by git — secrets must never be committed"
            exit 1
          fi

          # 扫"像真密钥"的字符串。
          #
          # 两条经验都来自真实误报：
          #  1. **必须有长度约束**。早期用 `DEEPSEEK_API_KEY=[^[:space:]]`，
          #     于是文档里的占位符 `DEEPSEEK_API_KEY=sk-...` 直接命中——
          #     等于没有判据，只会在自己的文档上反复变红。
          #  2. **排除要能跨目录**。`:!*.md` 这类 pathspec 通配不跨目录
          #     （`git ls-files '*.md'` 只列根目录），所以
          #     `autoresearch/README.md` 从未被排除过。
          #
          # 真密钥形态：`sk-` + 至少 20 个字母数字（OpenAI/DeepSeek 都远长于此）。
          # 占位符形态（`sk-...`、`sk-xxx`、`sk-在此填入你的密钥`）都不会命中。
          PATTERN='(^|[^A-Za-z0-9_-])sk-[A-Za-z0-9_-]{20,}'
          if git grep -nIE "$PATTERN" -- . \
               ':(exclude,glob)**/*.md' \
               ':(exclude,glob)**/*.example' \
               ':(exclude,glob)**/*.rst' \
               ':(exclude).env.example'; then
            echo "::error::possible committed API key (a real-looking sk- token)"
            exit 1
          fi
          echo "no committed secrets found"
